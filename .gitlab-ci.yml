# NairaFlow pipeline (one repo: app + infra)
# - lint + api-tests on every merge request and on main
# - scan-code: Gitleaks (secrets, full history) + Semgrep (insecure code)
# - build: all 3 images built with Buildah (no privileged pods) and pushed to the
#   GitLab Container Registry, tagged with the commit SHA (never "latest")
# - scan-image: Trivy fails on HIGH/CRITICAL CVEs that HAVE a fix
# - infra/ changes start the infrastructure child pipeline (infra/.gitlab-ci.yml)
# - the nightly schedule only runs the infra drift check

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

stages: [lint, test, scan-code, build, scan-image, infra]

.not_on_schedule:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

lint:
  stage: lint
  extends: .not_on_schedule
  image: python:3.12-slim
  script:
    - pip install -q "ruff==0.6.9"
    - ruff check services/

api-tests:
  stage: test
  extends: .not_on_schedule
  image: python:3.12-slim
  script:
    - cd services/api
    - pip install -q -r requirements-dev.txt
    - pytest -q

gitleaks:
  stage: scan-code
  extends: .not_on_schedule
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.21.2
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"          # full history: a secret deleted later is still a leak
  script:
    - gitleaks git --config .gitleaks.toml --redact --verbose .

semgrep:
  stage: scan-code
  extends: .not_on_schedule
  image: python:3.12-slim
  script:
    - pip install -q "semgrep==1.95.0"
    - semgrep scan --metrics=off --config p/python --config p/secrets --severity ERROR --error services/

build:
  stage: build
  extends: .not_on_schedule
  # Buildah builds OCI images without a Docker daemon and without privileged mode.
  # Day 8: pin this image by digest too.
  image: quay.io/buildah/stable@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
    BUILDAH_FORMAT: docker
  parallel:
    matrix:
      - SERVICE: [api, worker, web]
  script:
    - export IMAGE="${CI_REGISTRY_IMAGE}/${SERVICE}:${CI_COMMIT_SHA}"
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - buildah build -t "$IMAGE" "services/${SERVICE}"
    - buildah push "$IMAGE"
    - echo "Pushed $IMAGE"

trivy:
  stage: scan-image
  extends: .not_on_schedule
  image:
    name: docker.io/aquasec/trivy:0.57.1
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  parallel:
    matrix:
      - SERVICE: [api, worker, web]
  script:
    # Fail only on HIGH/CRITICAL findings that have a fix. Unfixed ones are reported,
    # and accepted risks are documented in .trivyignore.
    - trivy image --no-progress --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1
        "${CI_REGISTRY_IMAGE}/${SERVICE}:${CI_COMMIT_SHA}"

infra:
  stage: infra
  trigger:
    include: infra/.gitlab-ci.yml
    strategy: depend
  variables:
    PARENT_SOURCE: $CI_PIPELINE_SOURCE
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - changes:
        - infra/**/*
