# NairaFlow pipeline (one repo: app + infra)
# - lint + api-tests on every merge request and on main
# - scan-code: Gitleaks (secrets, full history) + Semgrep (insecure code)
# - build: all 3 images built with Buildah (no privileged pods) and pushed to the
#   GitLab Container Registry, tagged with the commit SHA (never "latest")
# - scan-image: Trivy fails on HIGH/CRITICAL CVEs that HAVE a fix
# - sign (main only): Syft SBOM + Cosign signature + SBOM and provenance attestations
# - infra/ changes start the infrastructure child pipeline (infra/.gitlab-ci.yml)
# - the nightly schedule only runs the infra drift check

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

stages: [lint, test, scan-code, build, scan-image, sign, infra]

.not_on_schedule:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

lint:
  stage: lint
  extends: .not_on_schedule
  image: python:3.12-slim
  script:
    - pip install -q "ruff==0.6.9"
    - ruff check services/

api-tests:
  stage: test
  extends: .not_on_schedule
  image: python:3.12-slim
  script:
    - cd services/api
    - pip install -q -r requirements-dev.txt
    - pytest -q

gitleaks:
  stage: scan-code
  extends: .not_on_schedule
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.21.2
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"          # full history: a secret deleted later is still a leak
  script:
    - gitleaks git --config .gitleaks.toml --redact --verbose .

semgrep:
  stage: scan-code
  extends: .not_on_schedule
  image: python:3.12-slim
  script:
    # semgrep 1.95 pulls an OpenTelemetry module that still imports pkg_resources,
    # which ships with setuptools; python:3.12-slim has no setuptools by default.
    - pip install -q "setuptools<80" "semgrep==1.95.0"
    - semgrep scan --metrics=off --config p/python --config p/secrets --severity ERROR --error services/

build:
  stage: build
  extends: .not_on_schedule
  # Buildah builds OCI images without a Docker daemon and without privileged mode.
  # Day 8: pin this image by digest too.
  image: quay.io/buildah/stable@sha256:a6f96bfffc47f36462985573d85e87f782bf2d8b37e02cb3dd307713bfa6cc13
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
    BUILDAH_FORMAT: docker
  parallel:
    matrix:
      - SERVICE: [api, worker, web]
  script:
    - export IMAGE="${CI_REGISTRY_IMAGE}/${SERVICE}:${CI_COMMIT_SHA}"
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - buildah build -t "$IMAGE" "services/${SERVICE}"
    - mkdir -p digests
    # Record the exact digest we pushed, so later stages sign THIS image, not a tag
    - buildah push --digestfile "digests/${SERVICE}.digest" "$IMAGE"
    - echo "Pushed $IMAGE ($(cat digests/${SERVICE}.digest))"
  artifacts:
    paths:
      - digests/
    expire_in: 1 week

trivy:
  stage: scan-image
  extends: .not_on_schedule
  image:
    name: docker.io/aquasec/trivy:0.57.1
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  parallel:
    matrix:
      - SERVICE: [api, worker, web]
  script:
    # Fail only on HIGH/CRITICAL findings that have a fix. Unfixed ones are reported,
    # and accepted risks are documented in .trivyignore.
    - trivy image --no-progress --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1
        "${CI_REGISTRY_IMAGE}/${SERVICE}:${CI_COMMIT_SHA}"

sbom-sign:
  stage: sign
  image: alpine:3.22
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # Only reviewed, merged code gets our seal. The signing key is a protected variable.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  parallel:
    matrix:
      - SERVICE: [api, worker, web]
  variables:
    SYFT_REGISTRY_AUTH_AUTHORITY: $CI_REGISTRY
    SYFT_REGISTRY_AUTH_USERNAME: $CI_REGISTRY_USER
    SYFT_REGISTRY_AUTH_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - apk add --no-cache cosign curl
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.18.1
    - export REF="${CI_REGISTRY_IMAGE}/${SERVICE}@$(cat digests/${SERVICE}.digest)"
    - echo "Signing $REF"
    - cosign login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    # 1. SBOM: the ingredients list of the image
    - syft scan "registry:${REF}" -o "cyclonedx-json=sbom-${SERVICE}.cdx.json"
    # 2. Signature: proof our pipeline produced this exact image.
    #    --tlog-upload=false: images are private/on-prem, so don't publish to the public Rekor log
    - cosign sign --key "$COSIGN_PRIVATE_KEY" --tlog-upload=false --yes "$REF"
    # 3. Attach the SBOM as a signed attestation
    - cosign attest --key "$COSIGN_PRIVATE_KEY" --tlog-upload=false --yes --type cyclonedx --predicate "sbom-${SERVICE}.cdx.json" "$REF"
    # 4. Provenance: a signed record of how and where it was built
    - |
      cat > "provenance-${SERVICE}.json" <<EOF
      {
        "buildDefinition": {
          "buildType": "${CI_PROJECT_URL}/-/blob/${CI_COMMIT_SHA}/.gitlab-ci.yml",
          "externalParameters": { "repository": "${CI_PROJECT_URL}", "ref": "${CI_COMMIT_REF_NAME}", "service": "${SERVICE}" },
          "resolvedDependencies": [ { "uri": "git+${CI_PROJECT_URL}", "digest": { "gitCommit": "${CI_COMMIT_SHA}" } } ]
        },
        "runDetails": {
          "builder": { "id": "${CI_SERVER_URL}/${CI_PROJECT_PATH}/runner/${CI_RUNNER_ID}" },
          "metadata": { "invocationId": "${CI_PIPELINE_URL}", "startedOn": "${CI_PIPELINE_CREATED_AT}" }
        }
      }
      EOF
    - cosign attest --key "$COSIGN_PRIVATE_KEY" --tlog-upload=false --yes --type slsaprovenance1 --predicate "provenance-${SERVICE}.json" "$REF"
    # 5. Prove it: verify with the PUBLIC key committed in the repo
    - cosign verify --key cosign.pub --insecure-ignore-tlog=true "$REF" > /dev/null && echo "Signature verified"
    - cosign verify-attestation --key cosign.pub --insecure-ignore-tlog=true --type cyclonedx "$REF" > /dev/null && echo "SBOM attestation verified"
  artifacts:
    paths:
      - sbom-*.cdx.json
      - provenance-*.json
    expire_in: 30 days

infra:
  stage: infra
  trigger:
    include: infra/.gitlab-ci.yml
    strategy: depend
  variables:
    PARENT_SOURCE: $CI_PIPELINE_SOURCE
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - changes:
        - infra/**/*
