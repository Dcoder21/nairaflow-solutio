# Day 12 — Our own Certificate Authority (CA), run by cert-manager.
# On-prem banks use an internal CA for internal services. Chain:
#   selfsigned-bootstrap  →  nairaflow-root-ca (the CA certificate)  →  nairaflow-ca (issues server certs)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nairaflow-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: NairaFlow Internal Root CA
  secretName: nairaflow-root-ca
  duration: 87600h            # 10 years (a root CA lives long; server certs do not)
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: nairaflow-ca
spec:
  ca:
    secretName: nairaflow-root-ca
