# Day 10 — PostgreSQL for the dev environment, run by the CloudNativePG operator.
# Apply with: kubectl apply -f deploy/db/postgres.yaml
#
# The operator creates a Secret called "pg-app" with the username, a random
# password and a ready-made connection string (key: "uri"). No password is
# written anywhere in Git.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nairaflow-schema
  namespace: nairaflow-dev
data:
  init.sql: |
    CREATE TABLE accounts (
        id           TEXT PRIMARY KEY,
        owner        TEXT NOT NULL,
        balance_kobo BIGINT NOT NULL CHECK (balance_kobo >= 0)
    );
    CREATE TABLE transfers (
        id           UUID PRIMARY KEY,
        from_account TEXT NOT NULL,
        to_account   TEXT NOT NULL,
        amount_kobo  BIGINT NOT NULL CHECK (amount_kobo > 0),
        narration    TEXT DEFAULT '',
        status       TEXT NOT NULL,
        reason       TEXT,
        created_at   TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX transfers_created_at_idx ON transfers (created_at DESC);
    INSERT INTO accounts VALUES
      ('ACC001', 'Adaeze Stores',      50000000),
      ('ACC002', 'Tunde Logistics',    25000000),
      ('ACC003', 'Ngozi Pharmacy',     10000000),
      ('ACC004', 'Musa Agro Supplies', 75000000);
    -- Scripts run as the superuser, so hand the tables to the app user.
    ALTER TABLE accounts  OWNER TO nairaflow;
    ALTER TABLE transfers OWNER TO nairaflow;
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  namespace: nairaflow-dev
spec:
  instances: 1            # dev: one copy. prod would use 3 (1 primary + 2 replicas).
  storage:
    size: 1Gi
  resources:              # needed because the namespace has a quota
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  bootstrap:
    initdb:
      database: nairaflow
      owner: nairaflow
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: nairaflow-schema
            key: init.sql
