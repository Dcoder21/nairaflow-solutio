apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app: web, app.kubernetes.io/part-of: nairaflow }
spec:
  replicas: {{ .Values.replicas.web }}
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web, app.kubernetes.io/part-of: nairaflow }
    spec:
      {{- include "nairaflow.podSecurity" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "nairaflow.image" (dict "root" . "name" "web") }}
          ports:
            - containerPort: 8080
          {{- include "nairaflow.containerSecurity" . | nindent 10 }}
          resources: {{- toYaml .Values.resources.web | nindent 12 }}
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 5
          volumeMounts:
            - { name: tmp, mountPath: /tmp }   # nginx-unprivileged writes its pid and cache here
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web                          # exposed through the HTTPS gateway on Day 12
spec:
  selector: { app: web }
  ports:
    - port: 8080
      targetPort: 8080
